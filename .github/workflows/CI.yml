name: CI - product-manager-api

on:
  push:
    branches: [main, "feature/patch"]
  pull_request:
    branches: [main]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: checkout du code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Installer les dépendances
        run: npm install

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Application Test
        run: npm run test

      - name: Linting
        run: npm run lint

      - name: Build
        run: npm run build
