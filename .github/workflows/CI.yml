name: CI - product-manager-api

on:
    push:
        branches: [main]
    pull_request: 
        branches: [main]
jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - name: checkout du code
              uses: actions/checkout@v5
            
            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '22'
                cache: 'npm'

            - name: Installer les dépendances
              run: npm install

            - name: Build
              run: npm run build

