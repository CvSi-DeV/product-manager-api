services:
  postgres:
    image: postgres:16-alpine
    container_name: product-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_password
      POSTGRES_DB: product_manager
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
